name: Audit FJA official notification candidates

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum rows to include (0 = all)"
        required: true
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: fja-candidate-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only FJA candidate audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate read-only report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FJA_AUDIT_LIMIT: ${{ inputs.limit || '0' }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret; audit stopped."; exit 1; }
          npx tsx scripts/audit-fja-candidates.ts
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: fja-candidate-audit
          path: artifacts/fja-candidate-audit-*.*
          if-no-files-found: error
          retention-days: 14
