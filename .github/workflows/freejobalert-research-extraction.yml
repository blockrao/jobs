name: FreeJobAlert Research Extraction

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Include listing update dates on/after this date (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-10-01"
      as_of_date:
        description: "Evaluate open/closed status as of this date (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-10-27"
      max_list_pages:
        description: "Maximum update-list pages to inspect"
        required: true
        type: string
        default: "120"
      max_records:
        description: "Maximum detail articles to extract; complete listing inventory is saved separately"
        required: true
        type: string
        default: "200"
  push:
    branches: [main]
    paths:
      - "scripts/extract-freejobalert-open-updates.ts"
      - "scripts/lib/fja-research-parser.ts"
      - "scripts/lib/fja-enrichment-mapper.ts"
      - ".github/workflows/freejobalert-research-extraction.yml"

permissions:
  contents: read

concurrency:
  group: freejobalert-research-extraction
  cancel-in-progress: false

jobs:
  extract:
    name: Extract FJA sample for configured date window (research only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bounded public-source extraction
        env:
          START_DATE: ${{ inputs.start_date || '2026-10-01' }}
          AS_OF_DATE: ${{ inputs.as_of_date || '2026-10-27' }}
          MAX_LIST_PAGES: ${{ inputs.max_list_pages || '120' }}
          MAX_RECORDS: ${{ inputs.max_records || '200' }}
          DELAY_MS: "1200"
          OUT_DIR: "artifacts/freejobalert-${{ inputs.start_date || '2026-10-01' }}-to-${{ inputs.as_of_date || '2026-10-27' }}"
        run: npx tsx scripts/extract-freejobalert-open-updates.ts
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freejobalert-extraction-${{ github.run_id }}
          path: artifacts/freejobalert-*/
          if-no-files-found: warn
          retention-days: 14
