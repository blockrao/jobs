name: FreeJobAlert Research Extraction

on:
  push:
    branches: [main]
    paths:
      - "scripts/extract-freejobalert-open-updates.ts"
      - ".github/workflows/freejobalert-research-extraction.yml"

permissions:
  contents: read

concurrency:
  group: freejobalert-research-extraction
  cancel-in-progress: false

jobs:
  extract:
    name: Extract dated open listings (research only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bounded public-source extraction
        env:
          START_DATE: "2026-10-02"
          AS_OF_DATE: "2026-10-09"
          MAX_LIST_PAGES: "20"
          DELAY_MS: "1200"
          OUT_DIR: "artifacts/freejobalert-full-extraction"
        run: npx tsx scripts/extract-freejobalert-open-updates.ts
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freejobalert-full-extraction
          path: artifacts/freejobalert-full-extraction/
          if-no-files-found: warn
          retention-days: 14
