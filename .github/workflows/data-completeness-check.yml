name: Data Completeness Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/db/**'
      - 'src/components/recruitment/**'
      - 'supabase/migrations/**'
      - '.github/workflows/data-completeness-check.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC to catch data drift
    - cron: '0 2 * * *'

jobs:
  completeness-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: joboye_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joboye_test
        run: |
          npx drizzle-kit migrate

      - name: Run completeness tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joboye_test
        run: npm run test -- completeness.test.ts

      - name: Generate completeness report
        if: always()
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joboye_test
        run: |
          npm run test -- completeness.test.ts --reporter=verbose > completeness-report.txt
          cat completeness-report.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: completeness-report
          path: completeness-report.txt

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('completeness-report.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Data Completeness Check\n\`\`\`\n${report}\n\`\`\``
            });

      - name: Fail if completeness below threshold
        run: |
          if grep -q "FAIL" completeness-report.txt; then
            echo "❌ Data completeness tests failed"
            exit 1
          else
            echo "✅ Data completeness tests passed"
          fi
