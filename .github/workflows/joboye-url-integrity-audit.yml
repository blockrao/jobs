name: JobOye URL integrity audit (read-only)

on:
  # Run four bounded batches per day so the inventory is checked progressively
  # without requiring a person to start each run.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public site base URL to request (preferred canonical host is joboye.com)"
        required: true
        type: string
        default: "https://joboye.com"
      scope:
        description: "canonical checks hubs and leaves; all also checks known recruitment aliases"
        required: true
        type: choice
        options:
          - canonical
          - all
        default: canonical
      limit:
        description: "Maximum URLs to check per batch (use 100 for safe resumable batches; 0 = all remaining URLs)"
        required: true
        type: string
        default: "100"
      offset:
        description: "Starting position in the balanced canonical inventory (0-based)"
        required: true
        type: string
        default: "0"
      concurrency:
        description: "Bounded request concurrency (1-12; use 4 for public-site audits)"
        required: true
        type: string
        default: "4"

permissions:
  contents: read

concurrency:
  group: joboye-read-only-url-integrity
  cancel-in-progress: false

jobs:
  audit:
    name: Check canonical URLs against public site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select safe audit batch
        id: audit_params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          INPUT_SCOPE: ${{ github.event.inputs.scope }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_OFFSET: ${{ github.event.inputs.offset }}
          INPUT_CONCURRENCY: ${{ github.event.inputs.concurrency }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "base_url=${INPUT_BASE_URL:-https://joboye.com}" >> "$GITHUB_OUTPUT"
          echo "scope=${INPUT_SCOPE:-canonical}" >> "$GITHUB_OUTPUT"
          echo "limit=${INPUT_LIMIT:-100}" >> "$GITHUB_OUTPUT"
          echo "concurrency=${INPUT_CONCURRENCY:-4}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Inventory was approximately 12.2k URLs at the last audit.
            # Rotate in 100-URL batches; four scheduled runs per day.
            offset=$(( (RUN_NUMBER * 100) % 12200 ))
          else
            offset="${INPUT_OFFSET:-0}"
          fi
          echo "offset=$offset" >> "$GITHUB_OUTPUT"
          echo "Selected ${INPUT_SCOPE:-canonical} audit batch at offset $offset"
      - name: Validate inputs
        env:
          BASE_URL: ${{ steps.audit_params.outputs.base_url }}
          CANONICAL_BASE_URL: "https://joboye.com"
          SCOPE: ${{ steps.audit_params.outputs.scope }}
          LIMIT: ${{ steps.audit_params.outputs.limit }}
          OFFSET: ${{ steps.audit_params.outputs.offset }}
          CONCURRENCY: ${{ steps.audit_params.outputs.concurrency }}
        run: |
          node - <<'NODE'
          const base = process.env.BASE_URL;
          let url;
          try { url = new URL(base); } catch { throw new Error('base_url must be an absolute URL'); }
          if (!['https:', 'http:'].includes(url.protocol)) throw new Error('base_url must use HTTP or HTTPS');
          if (!['canonical', 'all'].includes(process.env.SCOPE)) throw new Error('invalid scope');
          if (!/^\d+$/.test(process.env.LIMIT)) throw new Error('limit must be a non-negative integer');
          if (!/^\d+$/.test(process.env.OFFSET)) throw new Error('offset must be a non-negative integer');
          const c = Number(process.env.CONCURRENCY);
          if (!Number.isInteger(c) || c < 1 || c > 12) throw new Error('concurrency must be between 1 and 12');
          NODE
      - name: Run read-only URL integrity audit
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ steps.audit_params.outputs.base_url }}
          BASE_URL: ${{ steps.audit_params.outputs.base_url }}
          CANONICAL_BASE_URL: "https://joboye.com"
          SCOPE: ${{ steps.audit_params.outputs.scope }}
          LIMIT: ${{ steps.audit_params.outputs.limit }}
          OFFSET: ${{ steps.audit_params.outputs.offset }}
          CONCURRENCY: ${{ steps.audit_params.outputs.concurrency }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret; audit stopped."; exit 1; }
          mkdir -p artifacts
          npx tsx src/scripts/audit-url-integrity.ts --base "$BASE_URL" --canonical-base "$CANONICAL_BASE_URL" --scope "$SCOPE" --limit "$LIMIT" --offset "$OFFSET" --concurrency "$CONCURRENCY"
      - name: Upload audit report even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joboye-url-integrity-${{ github.run_id }}
          path: artifacts/url-integrity-*.json
          if-no-files-found: warn
          retention-days: 90
