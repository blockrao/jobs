name: FJA Promote to Canonical
on:
  # Manual trigger: promote specific FJA inventory rows to canonical recruitments/posts
  workflow_dispatch:
    inputs:
      external_ids:
        description: "Comma-separated FJA external_ids to promote (from fja_job_inventory)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no writes to canonical tables)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fja-promote-to-canonical
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Promote FJA inventory rows to canonical tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FJA_PROMOTE_EXTERNAL_IDS: ${{ inputs.external_ids }}
          FJA_PROMOTE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npx tsx scripts/promote-fja-to-canonical.ts
