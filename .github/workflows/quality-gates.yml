name: JobOye PR Quality Gates

on:
  # PRs targeting main use pull_request; stacked feature PRs are checked on push
  # to their head branch so the same suite runs without duplicate executions.
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'ci/**'
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'

permissions:
  contents: read

concurrency:
  group: joboye-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repository-wide lint command currently fails on hundreds of legacy
      # issues outside this change. Lint the files changed by this PR.
      - run: npx eslint src/ingest/adapters/util.ts src/ingest/deadline-authority.ts src/db/operations/write-postings-v2.ts tests/unit/ingest-deadline-parser.test.ts tests/unit/deadline-authority.test.ts

  contract-tests:
    name: Architecture contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contracts -- --reporter=dot

  contract-typecheck:
    name: Vacancy-integrity test type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check the new test and its pure helper in isolation. The full test
      # suite currently has unrelated legacy typing errors in other test files.
      - run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --types vitest/globals tests/contracts/unit/vacancy-integrity.test.ts src/lib/vacancy-integrity.ts tests/unit/deadline-authority.test.ts src/ingest/deadline-authority.ts

  application-typecheck:
    name: Application type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  fja-reconciliation-typecheck:
    name: FJA reconciliation importer type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --types node scripts/reconcile-fja-artifact.ts
