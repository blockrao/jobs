name: JobOye PR Quality Gates

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or commit to validate (for example fix/shared-lifecycle-sql-policy)"
        required: true
        default: "main"
        type: string
  # PRs targeting main use pull_request; stacked feature PRs are checked on push
  # to their head branch so the same suite runs without duplicate executions.
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'ci/**'
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'

permissions:
  contents: read

concurrency:
  group: joboye-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint changed application and contract files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' && inputs.target_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repository-wide lint command currently fails on legacy issues outside this change.
      # Gate this PR on every application/test file changed by the PR.
      - run: >-
          npx eslint
          src/lib/queries.ts
          "src/app/(default)/government-jobs/page.tsx"
          "src/app/(default)/jobs/[recruitment-slug]/[post-slug]/page.tsx"
          src/db/operations/get-posts.ts
          src/types/job-posting.ts
          src/components/job-posting/job-detail-page-production.tsx
          src/lib/source-verification.ts
          tests/contracts/unit/extracted-source-projection.test.ts
          tests/unit/source-verification.test.ts

  contract-tests:
    name: Architecture contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' && inputs.target_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contracts -- --reporter=dot

  contract-typecheck:
    name: Vacancy-integrity test type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' && inputs.target_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check the focused unit test and pure helper in isolation. The full test
      # suite currently has unrelated legacy typing errors in other test files.
      - run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --types vitest/globals tests/unit/source-verification.test.ts src/lib/source-verification.ts

  application-typecheck:
    name: Application type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' && inputs.target_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  fja-reconciliation-typecheck:
    name: FJA reconciliation importer type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' && inputs.target_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --types node scripts/reconcile-fja-artifact.ts
