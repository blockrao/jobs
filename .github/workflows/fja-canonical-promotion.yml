name: Promote new open FreeJobAlert records

on:
  # Intentionally manual-only: merging code must never trigger production writes.
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum eligible records to process (50 is a safe pilot; 0 = all)"
        required: true
        type: string
        default: "50"
      dry_run:
        description: "Dry run only; no database writes"
        required: true
        type: boolean
        default: true
      confirm_live_write:
        description: "Explicitly authorize production database writes when dry_run is false"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fja-canonical-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Deduplicate and ingest new open FJA records
    runs-on: ubuntu-latest
    # The canonical writer processes records sequentially; 30 minutes truncates
    # full-inventory runs. GitHub-hosted jobs support up to 6 hours.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate execution mode
        env:
          FJA_PROMOTE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          CONFIRM_LIVE_WRITE: ${{ inputs.confirm_live_write }}
        run: |
          if [ "$FJA_PROMOTE_DRY_RUN" != "1" ] && [ "$CONFIRM_LIVE_WRITE" != "true" ]; then
            echo "Refusing live promotion: set confirm_live_write=true explicitly."
            exit 1
          fi
      - name: Promote eligible new records through canonical writer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FJA_PROMOTE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FJA_PROMOTE_LIMIT: ${{ inputs.limit || '50' }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret; promotion stopped."; exit 1; }
          echo "Running FJA canonical promotion; dry_run=$FJA_PROMOTE_DRY_RUN limit=$FJA_PROMOTE_LIMIT"
          npx tsx scripts/promote-fja-to-canonical.ts
